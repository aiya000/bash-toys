name: Test rg-skip-self

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test/rg-skip-self.bats'
      - 'lib/**'
      - 'sources/**'
  pull_request:
    branches: [main]
    paths:
      - 'test/rg-skip-self.bats'
      - 'lib/**'
      - 'sources/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run test
        run: |
          source ./source-all.sh
          ./lib/bats/bin/bats ./test/rg-skip-self.bats
