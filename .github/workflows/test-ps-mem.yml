name: Test ps-mem

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/ps-mem'
      - 'test/ps-mem.bats'
      - 'lib/**'
      - 'sources/**'
  pull_request:
    branches: [main]
    paths:
      - 'bin/ps-mem'
      - 'test/ps-mem.bats'
      - 'lib/**'
      - 'sources/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - name: Run test
        run: |
          source ./source-all.sh
          ./lib/bats/bin/bats ./test/ps-mem.bats

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - name: Run test
        run: |
          source ./source-all.sh
          ./lib/bats/bin/bats ./test/ps-mem.bats
